<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Ink Container</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --void: #07080a;
    --panel: rgba(22, 23, 25, 0.9);
    --panel-edge: #3a3c3e;
    --header: #3f4144;
    --ink: #c8c2b2;
    --mute: #8b8a84;
    --brass: #c4a574;
    --teal: #5ec8c5;
    --hud: #c8d4b8;
    --track: #4a4c4e;
    --field: #1c1d1f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--void);
    color: var(--ink);
    font: 11px/1.3 Bahnschrift, "DIN Alternate", "Segoe UI Variable", "Segoe UI", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: crosshair;
  }
  body.kiosk canvas { cursor: none; }
  body.alpha, body.alpha canvas { background: transparent; }

  #gate { pointer-events: none; position: fixed; inset: 10px; z-index: 2; }
  body.kiosk #gate { display: none; }
  #gate .c {
    position: absolute; width: 22px; height: 22px;
    border: 1px solid rgba(196, 165, 116, 0.55);
  }
  #gate .tl { top: 0; left: 0; border-width: 1px 0 0 1px; }
  #gate .tr { top: 0; right: 0; border-width: 1px 1px 0 0; }
  #gate .bl { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
  #gate .br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

  #hud {
    position: fixed; top: 18px; left: 22px; z-index: 3;
    font-family: Consolas, "Cascadia Mono", Menlo, monospace;
    color: var(--hud);
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    pointer-events: none;
    letter-spacing: 0.04em;
    white-space: pre;
  }
  #hud .node { color: var(--brass); font-size: 11px; }
  #hud .dim { color: var(--mute); }
  body.kiosk #hud { display: none; }
  body.hud-on.kiosk #hud { display: block; }

  #ae {
    position: fixed; top: 14px; right: 14px; z-index: 4;
    width: 276px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    backdrop-filter: blur(16px);
    max-height: calc(100% - 28px);
    overflow: auto;
  }
  body.kiosk #ae { display: none; }
  #ae::-webkit-scrollbar { width: 8px; }
  #ae::-webkit-scrollbar-thumb { background: #444; }

  #ae-head {
    display: flex; align-items: center; gap: 8px;
    background: var(--header);
    padding: 6px 8px;
    color: #ddd;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 11px;
  }
  #ae-head .swatch {
    width: 10px; height: 10px; background: var(--teal);
    box-shadow: 0 0 0 1px #111;
    flex: none;
  }
  #ae-head .sp { flex: 1; }
  #ae-head button {
    background: #2a2b2d; color: var(--ink);
    border: 1px solid #555; padding: 2px 7px;
    font: inherit; letter-spacing: 0.04em; cursor: pointer;
  }
  #ae-head button:hover { border-color: var(--brass); color: #fff; }

  .grp { border-top: 1px solid #2e2f31; }
  .grp > h2 {
    margin: 0; padding: 6px 10px 5px;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: #d4d0c6;
    background: #2a2b2d;
    cursor: pointer;
  }
  .grp > h2::before { content: "▾ "; color: var(--brass); }
  .grp.shut > h2::before { content: "▸ "; }
  .grp.shut .body { display: none; }
  .body { padding: 6px 10px 8px; }

  .row {
    display: grid;
    grid-template-columns: 1fr 92px 42px;
    gap: 6px; align-items: center;
    min-height: 20px; margin: 3px 0;
  }
  .row label { color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val {
    color: var(--ink); text-align: right;
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 11px;
  }
  .row.btns { grid-template-columns: 1fr; display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 4px; }
  .row.full { grid-template-columns: 1fr; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 2px; background: var(--track);
    outline: none; margin: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 8px; height: 12px; background: var(--brass);
    cursor: pointer; border: 0;
  }
  input[type=range]::-moz-range-thumb {
    width: 8px; height: 12px; background: var(--brass);
    cursor: pointer; border: 0; border-radius: 0;
  }

  select, input[type=color] {
    width: 100%; background: var(--field); color: var(--ink);
    border: 1px solid #4a4a4a; font: inherit; height: 22px;
  }
  input[type=color] { padding: 0; border: 1px solid #4a4a4a; height: 22px; }
  button.act {
    background: #2a2b2d; color: var(--ink);
    border: 1px solid #555; padding: 4px 8px;
    font: inherit; cursor: pointer; letter-spacing: 0.04em;
  }
  button.act:hover { border-color: var(--teal); color: #fff; }
  button.act.on { background: #3a4a48; border-color: var(--teal); color: #fff; }

  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip {
    width: 16px; height: 16px; border: 1px solid #111;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
    cursor: pointer;
  }
  .chip.on { outline: 1px solid var(--brass); outline-offset: 1px; }

  #hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 3; color: var(--mute); letter-spacing: 0.16em;
    text-transform: uppercase; font-size: 10px;
    pointer-events: none; transition: opacity 1s ease;
    text-shadow: 0 1px 3px #000;
  }
  body.kiosk #hint, body.hint-off #hint { opacity: 0; }

  #fail {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: var(--void); color: #d88; padding: 48px;
    font-family: Consolas, monospace; white-space: pre-wrap;
  }
  #fail.show { display: block; }

  .pot-wrap {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 4px 4px;
  }
  .pot-wrap canvas { width: 88px; height: 88px; cursor: grab; flex: none; }
  .pot-wrap canvas:active { cursor: grabbing; }
  .pot-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pot-meta .k {
    color: var(--brass); letter-spacing: 0.16em; font-size: 10px;
  }
  .pot-meta .n {
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 22px; color: #eee; line-height: 1.1;
  }
  .pot-meta .src { color: var(--mute); font-size: 10px; letter-spacing: 0.04em; }

  #driveHud {
    position: fixed; left: 22px; bottom: 22px; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    pointer-events: none;
    opacity: 0; transition: opacity 0.4s ease;
    text-shadow: 0 1px 3px #000;
  }
  #driveHud.show { opacity: 1; }
  #driveHud canvas { width: 56px; height: 56px; }
  #driveHud .n {
    font-family: Consolas, "Cascadia Mono", monospace;
    color: var(--hud); font-size: 18px; letter-spacing: 0.06em;
  }
  #driveHud .k { color: var(--brass); font-size: 9px; letter-spacing: 0.18em; }

</head>
<body>
<canvas id="c"></canvas>
<div id="gate" aria-hidden="true">
  <span class="c tl"></span><span class="c tr"></span>
  <span class="c bl"></span><span class="c br"></span>
</div>
<div id="hud"></div>
<aside id="ae">
  <div id="ae-head">
    <span class="swatch"></span>
    <span>fluidShape1</span>
    <span class="sp"></span>
    <button type="button" id="btnHide" title="Hide panel (H)">Hide</button>
  </div>
  <div id="ae-body"></div>
</aside>
<div id="hint">drag to stir · [ ] energy · H panel</div>
<div id="driveHud" aria-hidden="true">
  <canvas id="potHud" width="112" height="112"></canvas>
  <div>
    <div class="k">ENERGY</div>
    <div class="n" id="driveHudVal">5.0</div>
  </div>
</div>
<div id="fail"></div>
<script>
(() => {
  "use strict";

  const qs = new URLSearchParams(location.search);
  const MODE = (qs.get("mode") || "app").toLowerCase();
  const KIOSK = MODE === "screensaver" || MODE === "obs" || qs.get("ui") === "0";
  const ALPHA = qs.get("alpha") === "1" || qs.get("transparent") === "1";
  if (KIOSK) document.body.classList.add("kiosk");
  if (ALPHA) document.body.classList.add("alpha");
  if (qs.get("hud") === "1") document.body.classList.add("hud-on");

  const canvas = document.getElementById("c");
  const hudEl = document.getElementById("hud");
  const failEl = document.getElementById("fail");
  const aeBody = document.getElementById("ae-body");

  const PRESETS = {
    demo: {
      label: "Tech Demo",
      viscosity: 0, swirl: 28, pressureIters: 24, timestep: 1,
      velDiss: 0.22, densDiss: 0.2, tempDiss: 0.45,
      buoyancy: 0.55, gravity: 0.08,
      shadow: 1.35, ambient: 0.16, incandescence: 0.55, bloom: 0.26, dropoff: 0.07,
      splatForce: 6400, splatRadius: 0.28, densityAmt: 0.85, tempAmt: 0.35,
      attract: 1, attractForce: 1
    },
    ink: {
      label: "Ink",
      viscosity: 0.04, swirl: 18, pressureIters: 22, timestep: 1,
      velDiss: 0.18, densDiss: 0.04, tempDiss: 0.6,
      buoyancy: 0.08, gravity: 0.02,
      shadow: 0.85, ambient: 0.18, incandescence: 0.12, bloom: 0.16, dropoff: 0.04,
      splatForce: 5200, splatRadius: 0.24, densityAmt: 1, tempAmt: 0.05,
      attract: 1, attractForce: 0.85
    },
    cloud: {
      label: "Cloud",
      viscosity: 0.08, swirl: 12, pressureIters: 20, timestep: 1,
      velDiss: 0.28, densDiss: 0.22, tempDiss: 0.35,
      buoyancy: 1.4, gravity: 0.15,
      shadow: 2.2, ambient: 0.18, incandescence: 0.0, bloom: 0.08, dropoff: 0.1,
      splatForce: 3800, splatRadius: 0.4, densityAmt: 0.55, tempAmt: 0.7,
      attract: 1, attractForce: 0.5
    },
    fire: {
      label: "Fire",
      viscosity: 0, swirl: 16, pressureIters: 20, timestep: 1,
      velDiss: 0.38, densDiss: 0.72, tempDiss: 0.55,
      buoyancy: 0.9, gravity: 0.04,
      shadow: 1.1, ambient: 0.08, incandescence: 1.15, bloom: 0.55, dropoff: 0.06,
      splatForce: 4200, splatRadius: 0.22, densityAmt: 0.45, tempAmt: 0.8,
      attract: 1, attractForce: 0.85
    },
    fog: {
      label: "Fog",
      viscosity: 0.18, swirl: 6, pressureIters: 16, timestep: 0.9,
      velDiss: 0.42, densDiss: 0.18, tempDiss: 0.4,
      buoyancy: 0.35, gravity: 0.0,
      shadow: 1.6, ambient: 0.32, incandescence: 0.0, bloom: 0.05, dropoff: 0.16,
      splatForce: 2400, splatRadius: 0.5, densityAmt: 0.35, tempAmt: 0.2,
      attract: 1, attractForce: 0.4
    }
  };

  const QUALITY = {
    low:    { sim: 128, dye: 1.5, pressure: 0.7, shadows: 8 },
    medium: { sim: 192, dye: 2,   pressure: 0.85, shadows: 12 },
    high:   { sim: 256, dye: 2,   pressure: 1, shadows: 16 },
    ultra:  { sim: 384, dye: 2,   pressure: 1.15, shadows: 20 }
  };

  const VIZ = [
    { id: "dye", label: "Shaded Dye" },
    { id: "raw", label: "Raw Dye" },
    { id: "velocity", label: "Velocity" },
    { id: "pressure", label: "Pressure" },
    { id: "divergence", label: "Divergence" },
    { id: "vorticity", label: "Vorticity" },
    { id: "temperature", label: "Temperature" }
  ];

  const CHIPS = [
    "#3cf0e8", "#ff9a3c", "#ff4f8b", "#f4efe4",
    "#ff6a2a", "#5aa8ff", "#e7c56a", "#d8d2c4"
  ];
  const DYE_CHIPS = ["#3cf0e8", "#ff9a3c", "#ff4f8b", "#ff6a2a", "#5aa8ff", "#e7c56a"];

  const S = {
    preset: qs.get("preset") || "demo",
    quality: qs.get("quality") || (MODE === "screensaver" ? "high" : "high"),
    viz: qs.get("viz") || "dye",
    paused: false,
    viscosity: 0,
    swirl: 28,
    pressureIters: 24,
    timestep: 1,
    velDiss: 0.22,
    densDiss: 0.12,
    tempDiss: 0.45,
    buoyancy: 0.55,
    gravity: 0.08,
    shadow: 1.35,
    ambient: 0.28,
    incandescence: 0.55,
    bloom: 0.42,
    dropoff: 0.07,
    splatForce: 6400,
    splatRadius: 0.28,
    densityAmt: 0.85,
    tempAmt: 0.35,
    attract: 1,
    attractForce: 1,
    energy: 0.5,
    color: CHIPS[0],
    bloomOn: qs.get("bloom") !== "0"
  };

  applyPreset(S.preset, false);
  if (qs.get("energy") != null) S.energy = Math.max(0, Math.min(1, +qs.get("energy")));
  if (qs.get("attract") === "0") S.attract = 0;
  if (qs.get("attract") === "1") S.attract = 1;

  function applyPreset(name, syncUi) {
    const p = PRESETS[name] || PRESETS.demo;
    S.preset = PRESETS[name] ? name : "demo";
    for (const k of Object.keys(p)) {
      if (k === "label") continue;
      S[k] = p[k];
    }
    if (name === "cloud" || name === "fog") S.color = "#d8d2c4";
    else if (name === "fire") S.color = "#ff6a2a";
    else S.color = DYE_CHIPS[0];
    if (syncUi) syncAll();
  }

  function fail(msg) {
    failEl.textContent = "// Error\n// " + msg.split("\n").join("\n// ");
    failEl.classList.add("show");
  }

  const gl = canvas.getContext("webgl2", {
    alpha: ALPHA,
    premultipliedAlpha: true,
    antialias: false,
    depth: false,
    stencil: false,
    preserveDrawingBuffer: MODE === "obs",
    powerPreference: "high-performance"
  });
  if (!gl) {
    fail("WebGL2 is required.\nInk Container needs a GPU that can create a WebGL2 context.");
    return;
  }

  const extColor = gl.getExtension("EXT_color_buffer_float")
    || gl.getExtension("EXT_color_buffer_half_float");
  const extFloatLin = gl.getExtension("OES_texture_float_linear");
  gl.getExtension("EXT_float_blend");
  gl.getExtension("EXT_color_buffer_half_float");
  if (!extColor) {
    fail("EXT_color_buffer_float is unavailable.\nFloating-point simulation targets are required.");
    return;
  }

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error(log);
    }
    return sh;
  }

  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, "aPos");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(p));
    }
    const uniforms = {};
    const n = gl.getActiveUniformCount ? gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) : gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      uniforms[info.name] = gl.getUniformLocation(p, info.name);
    }
    return { p, uniforms };
  }

  const VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

  const FS_HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 fragColor;
`;

  function fs(body) { return FS_HEAD + body; }

  const blitVS = VS;
  let P;
  try {
    P = {
      splat: program(blitVS, fs(`
        uniform sampler2D uTarget;
        uniform vec2 uPoint;
        uniform vec3 uColor;
        uniform vec2 uVelocity;
        uniform float uRadius;
        uniform float uAspect;
        uniform float uDensity;
        uniform float uTemp;
        uniform int uMode;
        void main(){
          vec2 p = vUv - uPoint;
          p.x *= uAspect;
          float g = exp(-dot(p,p) / max(uRadius, 1e-6));
          vec4 base = texture(uTarget, vUv);
          if (uMode == 0) {
            fragColor = base + vec4(uVelocity * g, 0.0, 0.0);
          } else if (uMode == 1) {
            float room = 1.0 - smoothstep(0.9, 2.4, base.a);
            fragColor = base + vec4(uColor * g * 1.7, g * uDensity) * room;
          } else {
            float room = 1.0 - smoothstep(0.9, 2.4, base.r);
            fragColor = base + vec4(uTemp * g, 0.0, 0.0, 0.0) * room;
          }
        }`)),
      advect: program(blitVS, fs(`
        uniform sampler2D uVel;
        uniform sampler2D uSrc;
        uniform vec2 uTexel;
        uniform vec2 uVelTexel;
        uniform float uDt;
        uniform float uDiss;
        uniform vec2 uSrcRes;
        vec4 bilerp(sampler2D tex, vec2 uv, vec2 res){
          vec2 px = uv * res - 0.5;
          vec2 f = fract(px);
          vec2 p0 = (floor(px) + 0.5) / res;
          vec2 t = 1.0 / res;
          vec4 a = texture(tex, p0);
          vec4 b = texture(tex, p0 + vec2(t.x, 0.0));
          vec4 c = texture(tex, p0 + vec2(0.0, t.y));
          vec4 d = texture(tex, p0 + vec2(t.x, t.y));
          return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
        }
        void main(){
          vec2 vel = texture(uVel, vUv).xy;
          vec2 coord = vUv - uDt * vel * uVelTexel;
          coord = clamp(coord, uTexel, 1.0 - uTexel);
          fragColor = bilerp(uSrc, coord, uSrcRes) * uDiss;
        }`)),
      mac: program(blitVS, fs(`
        uniform sampler2D uPhi;
        uniform sampler2D uHat;
        uniform sampler2D uHatHat;
        uniform vec2 uTexel;
        uniform float uDiss;
        void main(){
          vec4 phi = texture(uPhi, vUv);
          vec4 hat = texture(uHat, vUv);
          vec4 hathat = texture(uHatHat, vUv);
          vec4 n = hat + 0.5 * (phi - hathat);
          vec2 t = uTexel;
          vec4 c0 = texture(uHat, vUv + vec2(-t.x, 0.0));
          vec4 c1 = texture(uHat, vUv + vec2( t.x, 0.0));
          vec4 c2 = texture(uHat, vUv + vec2(0.0, -t.y));
          vec4 c3 = texture(uHat, vUv + vec2(0.0,  t.y));
          vec4 mn = min(hat, min(c0, min(c1, min(c2, c3))));
          vec4 mx = max(hat, max(c0, max(c1, max(c2, c3))));
          n = clamp(n, mn, mx);
          fragColor = max(n * uDiss, 0.0);
        }`)),
      buoyancy: program(blitVS, fs(`
        uniform sampler2D uVel;
        uniform sampler2D uDye;
        uniform sampler2D uTemp;
        uniform float uBuoy;
        uniform float uGrav;
        uniform float uDt;
        uniform vec2 uTexel;
        void main(){
          vec2 vel = texture(uVel, vUv).xy;
          float d = texture(uDye, vUv).a;
          float t = texture(uTemp, vUv).r;
          vec2 accel = vec2(0.0, (uBuoy * t - uGrav * d) * 0.25);
          vel += accel * uDt / max(uTexel.y, 1e-6);
          fragColor = vec4(vel, 0.0, 1.0);
        }`)),
      curl: program(blitVS, fs(`
        uniform sampler2D uVel;
        uniform vec2 uTexel;
        void main(){
          vec2 L = texture(uVel, vUv - vec2(uTexel.x, 0.0)).xy;
          vec2 R = texture(uVel, vUv + vec2(uTexel.x, 0.0)).xy;
          vec2 B = texture(uVel, vUv - vec2(0.0, uTexel.y)).xy;
          vec2 T = texture(uVel, vUv + vec2(0.0, uTexel.y)).xy;
          float curl = R.y - L.y - T.x + B.x;
          fragColor = vec4(0.5 * curl, 0.0, 0.0, 1.0);
        }`)),
      vort: program(blitVS, fs(`
        uniform sampler2D uVel;
        uniform sampler2D uCurl;
        uniform vec2 uTexel;
        uniform float uSwirl;
        uniform float uDt;
        void main(){
          float L = texture(uCurl, vUv - vec2(uTexel.x, 0.0)).r;
          float R = texture(uCurl, vUv + vec2(uTexel.x, 0.0)).r;
          float B = texture(uCurl, vUv - vec2(0.0, uTexel.y)).r;
          float T = texture(uCurl, vUv + vec2(0.0, uTexel.y)).r;
          float C = texture(uCurl, vUv).r;
          vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
          float len = length(force) + 1e-4;
          force = force / len * uSwirl * C;
          force.y *= -1.0;
          vec2 vel = texture(uVel, vUv).xy;
          fragColor = vec4(vel + force * uDt, 0.0, 1.0);
        }`)),
      divergence: program(blitVS, fs(`
        uniform sampler2D uVel;
        uniform vec2 uTexel;
        void main(){

    }

    {
      const u = bindProg(P.divergence);
      bindTex(u.uVel, 0, sim.vel.read.tex);
      gl.uniform2f(u.uTexel, vtex[0], vtex[1]);
      drawTo(sim.div);
    }

    {
      const u = bindProg(P.fade);
      bindTex(u.uTex, 0, sim.pressure.read.tex);
      gl.uniform1f(u.uValue, 0.8);
      drawTo(sim.pressure.write);
      sim.pressure.swap();
    }

    const iters = Math.max(4, Math.round(S.pressureIters * (QUALITY[S.quality] || QUALITY.high).pressure));
    for (let i = 0; i < iters; i++) {
      const u = bindProg(P.jacobi);
      bindTex(u.uPressure, 0, sim.pressure.read.tex);
      bindTex(u.uDiv, 1, sim.div.tex);
      gl.uniform2f(u.uTexel, vtex[0], vtex[1]);
      drawTo(sim.pressure.write);
      sim.pressure.swap();
    }

    {
      const u = bindProg(P.gradient);
      bindTex(u.uVel, 0, sim.vel.read.tex);
      bindTex(u.uPressure, 1, sim.pressure.read.tex);
      gl.uniform2f(u.uTexel, vtex[0], vtex[1]);
      drawTo(sim.vel.write);
      sim.vel.swap();
    }

    {
      const u = bindProg(P.advect);
      bindTex(u.uVel, 0, sim.vel.read.tex);
      bindTex(u.uSrc, 1, sim.vel.read.tex);
      gl.uniform2f(u.uTexel, vtex[0], vtex[1]);
      gl.uniform2f(u.uVelTexel, vtex[0], vtex[1]);
      gl.uniform1f(u.uDt, dt);
      gl.uniform1f(u.uDiss, dissipate(S.velDiss + (1 - S.energy) * 0.32, dt));
      gl.uniform2f(u.uSrcRes, sim.vel.w, sim.vel.h);
      drawTo(sim.vel.write);
      sim.vel.swap();
    }

    // MacCormack dye
    {
      let u = bindProg(P.advect);
      bindTex(u.uVel, 0, sim.vel.read.tex);
      bindTex(u.uSrc, 1, sim.dye.read.tex);
      gl.uniform2f(u.uTexel, dtex[0], dtex[1]);
      gl.uniform2f(u.uVelTexel, vtex[0], vtex[1]);
      gl.uniform1f(u.uDt, dt);
      gl.uniform1f(u.uDiss, 1);
      gl.uniform2f(u.uSrcRes, sim.dye.w, sim.dye.h);
      drawTo(sim.hat);

      u = bindProg(P.advect);
      bindTex(u.uVel, 0, sim.vel.read.tex);
      bindTex(u.uSrc, 1, sim.hat.tex);
      gl.uniform2f(u.uTexel, dtex[0], dtex[1]);
      gl.uniform2f(u.uVelTexel, vtex[0], vtex[1]);
      gl.uniform1f(u.uDt, -dt);
      gl.uniform1f(u.uDiss, 1);
      gl.uniform2f(u.uSrcRes, sim.dye.w, sim.dye.h);
      drawTo(sim.hathat);

      u = bindProg(P.mac);
      bindTex(u.uPhi, 0, sim.dye.read.tex);
      bindTex(u.uHat, 1, sim.hat.tex);
      bindTex(u.uHatHat, 2, sim.hathat.tex);
      gl.uniform2f(u.uTexel, dtex[0], dtex[1]);
      gl.uniform1f(u.uDiss, dissipate(S.densDiss, dt));
      drawTo(sim.dye.write);
      sim.dye.swap();
    }

    {
      const u = bindProg(P.advect);
      bindTex(u.uVel, 0, sim.vel.read.tex);
      bindTex(u.uSrc, 1, sim.temp.read.tex);
      gl.uniform2f(u.uTexel, vtex[0], vtex[1]);
      gl.uniform2f(u.uVelTexel, vtex[0], vtex[1]);
      gl.uniform1f(u.uDt, dt);
      gl.uniform1f(u.uDiss, dissipate(S.tempDiss, dt));
      gl.uniform2f(u.uSrcRes, sim.temp.w, sim.temp.h);
      drawTo(sim.temp.write);
      sim.temp.swap();
    }
  }

  const VIZ_INDEX = { dye: 0, raw: 1, velocity: 2, pressure: 3, divergence: 4, vorticity: 5, temperature: 6 };

  function render() {
    const mode = VIZ_INDEX[S.viz] || 0;
    const q = QUALITY[S.quality] || QUALITY.high;
    const u = bindProg(P.display);
    bindTex(u.uDye, 0, sim.dye.read.tex);
    bindTex(u.uVel, 1, sim.vel.read.tex);
    bindTex(u.uTemp, 2, sim.temp.read.tex);
    bindTex(u.uPressure, 3, sim.pressure.read.tex);
    bindTex(u.uDiv, 4, sim.div.tex);
    bindTex(u.uCurl, 5, sim.curl.tex);
    gl.uniform2f(u.uTexel, sim.dye.texel[0], sim.dye.texel[1]);
    gl.uniform2f(u.uLightDir, 0.55, 0.85);
    gl.uniform1f(u.uExtinction, S.shadow);
    gl.uniform1f(u.uAmbient, S.ambient);
    gl.uniform1f(u.uIncand, S.incandescence);
    gl.uniform1f(u.uDropoff, S.dropoff);
    gl.uniform1f(u.uExposure, 1.35);
    gl.uniform1f(u.uAlphaMode, ALPHA ? 1 : 0);
    gl.uniform1i(u.uMode, mode);
    gl.uniform1i(u.uShadowSteps, q.shadows);

    const useBloom = S.bloomOn && S.bloom > 0.01 && mode === 0;
    if (!useBloom) {
      if (ALPHA) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
      drawTo(null);
      return;
    }

    drawTo(sim.beauty);

    let e = bindProg(P.extract);
    bindTex(e.uTex, 0, sim.beauty.tex);
    gl.uniform1f(e.uThresh, 0.72);
    drawTo(sim.bloom0);

    e = bindProg(P.blur);
    bindTex(e.uTex, 0, sim.bloom0.tex);
    gl.uniform2f(e.uTexel, sim.bloom0.texel[0], sim.bloom0.texel[1]);
    gl.uniform2f(e.uDir, 1, 0);
    drawTo(sim.bloom1);

    e = bindProg(P.blur);
    bindTex(e.uTex, 0, sim.bloom1.tex);
    gl.uniform2f(e.uTexel, sim.bloom1.texel[0], sim.bloom1.texel[1]);
    gl.uniform2f(e.uDir, 0, 1);
    drawTo(sim.bloom0);

    e = bindProg(P.composite);
    bindTex(e.uBeauty, 0, sim.beauty.tex);
    bindTex(e.uBloom, 1, sim.bloom0.tex);
    gl.uniform1f(e.uBloomAmt, S.bloom);
    gl.uniform1f(e.uAlphaMode, ALPHA ? 1 : 0);
    if (ALPHA) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
    drawTo(null);
  }

  const pointers = new Map();
  function uvFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width,
      y: 1 - (e.clientY - r.top) / r.height
    };
  }

  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    const uv = uvFromEvent(e);
    pointers.set(e.pointerId, { x: uv.x, y: uv.y, down: true });
    if (e.button === 1) {
      S.color = CHIPS[Math.floor(Math.random() * CHIPS.length)];
      syncAll();
    }
  });
  canvas.addEventListener("pointerup", (e) => pointers.delete(e.pointerId));
  canvas.addEventListener("pointercancel", (e) => pointers.delete(e.pointerId));
  canvas.addEventListener("pointermove", (e) => {
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const p = pointers.get(e.pointerId);
    if (!p || !p.down) {
      if (!p) pointers.set(e.pointerId, { x: uvFromEvent(e).x, y: uvFromEvent(e).y, down: false });
      return;
    }
    for (const ev of events) {
      const uv = uvFromEvent(ev);
      const dx = uv.x - p.x;
      const dy = uv.y - p.y;
      const force = S.splatForce * (0.35 + 0.65 * drive());
      const rgb = hexToRgb(S.color);
      splatAt(uv.x, uv.y, dx * force, dy * force, rgb, S.densityAmt, S.tempAmt, S.splatRadius);
      p.x = uv.x; p.y = uv.y;
    }
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  function rand(a, b) { return a + Math.random() * (b - a); }

  function palette() {
    if (S.preset === "fire") return ["#2a1810", "#ff6a2a", "#ffb03a"];
    if (S.preset === "cloud" || S.preset === "fog") return ["#d8d2c4", "#a8b4c0"];
    if (S.preset === "ink") return ["#3cf0e8", "#ff4f8b"];
    return ["#3cf0e8", "#ff9a3c"];
  }

  function seed(n) {
    if (S.preset === "fire") {
      for (let i = 0; i < 3; i++) {
        const x = 0.3 + i * 0.2;
        splatAt(x, 0.1, 0, 0.06 * S.splatForce, hexToRgb("#ff6a2a"), 0.22, 0.8, 0.12);
      }
      return;
    }
    n = n || 6;
    const pal = palette();
    for (let i = 0; i < n; i++) {
      const x = rand(0.18, 0.82);
      const y = rand(0.18, 0.82);
      const ang = rand(0, Math.PI * 2);
      const mag = rand(0.08, 0.18);
      const col = hexToRgb(pal[i % pal.length]);
      splatAt(x, y, Math.cos(ang) * mag * S.splatForce, Math.sin(ang) * mag * S.splatForce, col, S.densityAmt * 0.7, 0.15, rand(0.1, 0.18));
    }
  }

  function resetAll(doSeed) {
    alloc();
    clearFBO(sim.vel.read, 0, 0, 0, 0);
    clearFBO(sim.vel.write, 0, 0, 0, 0);
    clearFBO(sim.dye.read, 0, 0, 0, 0);
    clearFBO(sim.dye.write, 0, 0, 0, 0);
    clearFBO(sim.temp.read, 0, 0, 0, 0);
    clearFBO(sim.temp.write, 0, 0, 0, 0);
    clearFBO(sim.pressure.read, 0, 0, 0, 0);
    clearFBO(sim.pressure.write, 0, 0, 0, 0);
    if (doSeed !== false) seed(S.preset === "fire" ? 5 : 7);
  }

  function clearDye() {
    clearFBO(sim.dye.read, 0, 0, 0, 0);
    clearFBO(sim.dye.write, 0, 0, 0, 0);
    clearFBO(sim.temp.read, 0, 0, 0, 0);
    clearFBO(sim.temp.write, 0, 0, 0, 0);
  }

  // Ghost brushes — the unattended tech-demo "hand"
  const ghosts = [];
  function resetGhosts() {
    ghosts.length = 0;
    const pal = palette();
    const n = S.preset === "fire" ? 0 : 2;
    for (let i = 0; i < n; i++) {
      ghosts.push({
        x: rand(0.2, 0.8), y: rand(0.2, 0.8),
        tx: rand(0.15, 0.85), ty: rand(0.15, 0.85),
        vx: 0, vy: 0,
        color: pal[i % pal.length],
        speed: rand(0.35, 0.9),
        phase: rand(0, Math.PI * 2),
        radius: rand(0.11, 0.2)
      });
    }
  }

  function attract(dt, t) {
    if (!S.attract) return;
    const k = S.attractForce * drive();
    const inj = 0.2 + 0.8 * drive();
    if (S.preset === "fire") {
      for (let i = 0; i < 3; i++) {
        const x = 0.28 + i * 0.22 + 0.03 * Math.sin(t * 0.7 + i * 1.7);
        const y = 0.08 + 0.015 * Math.sin(t * 1.3 + i);
        const col = hexToRgb(i % 2 ? "#ff6a2a" : "#ffb03a");
        splatAt(x, y, Math.sin(t * 2 + i) * 0.003 * S.splatForce, 0.02 * k * S.splatForce, col, 0.03 * inj, 0.45 * inj, 0.13);
      }
      return;
    }
    if (S.preset === "cloud" || S.preset === "fog") {
      for (let i = 0; i < 3; i++) {
        const x = 0.3 + i * 0.2 + 0.05 * Math.sin(t * 0.25 + i);
        const y = 0.12 + 0.03 * Math.sin(t * 0.4 + i * 2);
        splatAt(x, y, 0.002 * S.splatForce, 0.02 * k * S.splatForce, hexToRgb("#d8d2c4"), S.densityAmt * 0.12 * inj, 0.45 * inj, 0.42);
      }
      return;
    }
    for (const g of ghosts) {
      const aimx = g.tx - g.x;
      const aimy = g.ty - g.y;
      if (aimx * aimx + aimy * aimy < 0.0025) {
        g.tx = rand(0.12, 0.88);
        g.ty = rand(0.12, 0.88);
        const pal = palette();
        if (Math.random() < 0.12) g.color = pal[Math.floor(Math.random() * pal.length)];
      }
      g.vx += aimx * g.speed * dt * 2.5 * drive();
      g.vy += aimy * g.speed * dt * 2.5 * drive();
      g.vx *= 0.92; g.vy *= 0.92;
      const px = g.x, py = g.y;
      g.x += g.vx * dt * 1.8;
      g.y += g.vy * dt * 1.8;
      const rgb = hexToRgb(g.color);
      splatAt(g.x, g.y, (g.x - px) * S.splatForce * k, (g.y - py) * S.splatForce * k, rgb, S.densityAmt * 0.1 * k * inj, S.tempAmt * 0.25 * inj, g.radius);
    }
  }

  function drawPotOn(canvas) {
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    const cx = w / 2, cy = h / 2, r = w * 0.36;
    ctx.clearRect(0, 0, w, h);
    const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
    const a = a0 + (a1 - a0) * S.energy;
    ctx.lineWidth = w * 0.07;
    ctx.strokeStyle = "#3a3c3e";
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
    const grd = ctx.createLinearGradient(0, 0, w, h);
    grd.addColorStop(0, "#5ec8c5");
    grd.addColorStop(1, "#c4a574");
    ctx.strokeStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a); ctx.stroke();
    ctx.strokeStyle = "rgba(196,165,116,0.85)";
    ctx.lineWidth = w * 0.018;
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.22, 0, Math.PI * 2); ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a);
    ctx.strokeStyle = "#e8e2d4";
    ctx.lineWidth = w * 0.035;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 0.82, 0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = "#c4a574";
    ctx.beginPath(); ctx.arc(cx, cy, w * 0.045, 0, Math.PI * 2); ctx.fill();
  }
  function updatePot() {
    drawPotOn(document.getElementById("potMain"));
    drawPotOn(document.getElementById("potHud"));
    const n = document.getElementById("potNum");
    if (n) n.textContent = energyLabel();
    const hv = document.getElementById("driveHudVal");
    if (hv) hv.textContent = energyLabel();
    const src = document.getElementById("potSrc");
    if (src) src.textContent = energySrc;
  }
  function bindPot(canvas) {
    let dragging = false;
    function fromEvent(e) {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      let ang = Math.atan2(y, x);
      let t = (ang - Math.PI * 0.75) / (Math.PI * 1.5);
      if (t < 0) t += 2;
      setEnergy(Math.max(0, Math.min(1, t)), "pot");
    }
    canvas.addEventListener("pointerdown", (e) => { dragging = true; canvas.setPointerCapture(e.pointerId); fromEvent(e); });
    canvas.addEventListener("pointermove", (e) => { if (dragging) fromEvent(e); });
    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      nudgeEnergy((e.deltaY > 0 ? -1 : 1) * (e.shiftKey ? 0.35 : 1), "wheel");
    }, { passive: false });
  }

  const LOGI_FILTERS = [
    { vendorId: 0x046d, productId: 0xbc00 },
    { vendorId: 0x046d, productId: 0xc354 }
  ];
  function hidDelta(prev, cur) {
    let best = 0;
    const n = Math.min(prev.length, cur.length);
    for (let i = 0; i < n; i++) {
      let d = cur[i] - prev[i];
      if (d > 127) d -= 256;
      if (d < -128) d += 256;
      if (Math.abs(d) > 0 && Math.abs(d) <= 24 && Math.abs(d) > Math.abs(best)) best = d;
    }
    return best;
  }
  async function listenHidDevice(device) {
    try { await device.open(); } catch (_) { return false; }
    const prev = new Map();
    device.addEventListener("inputreport", (ev) => {
      const cur = new Uint8Array(ev.data.buffer);
      const key = ev.reportId;
      if (!prev.has(key)) { prev.set(key, cur.slice()); return; }
      const d = hidDelta(prev.get(key), cur);
      prev.set(key, cur.slice());
      if (d) nudgeEnergy(d, "mx");
    });
    return true;
  }
  async function armMxHid(btn) {
    if (!navigator.hid) {
      if (btn) btn.textContent = "WebHID unavailable";
      return;
    }
    try {
      const already = await navigator.hid.getDevices();
      const known = already.filter(d => d.vendorId === 0x046d);
      let ok = false;
      for (const d of known) ok = (await listenHidDevice(d)) || ok;
      if (!ok) {
        const pick = await navigator.hid.requestDevice({
          filters: [...LOGI_FILTERS, { vendorId: 0x046d }]
        });
        for (const d of pick) ok = (await listenHidDevice(d)) || ok;
      }
      if (btn) {
        btn.textContent = ok ? "MX Console armed" : "No dial claimed";
        btn.classList.toggle("on", ok);
      }
      if (ok) energySrc = "mx";
    } catch (err) {
      if (btn) btn.textContent = "HID blocked";
      console.warn(err);
    }
  }
  async function armMidi(btn) {
    if (!navigator.requestMIDIAccess) {
      if (btn) btn.textContent = "MIDI unavailable";
      return;
    }
    try {
      const access = await navigator.requestMIDIAccess({ sysex: false });
      let last = -1;
      const onMsg = (ev) => {
        const [st, d1, d2] = ev.data;
        if ((st & 0xf0) !== 0xb0) return;
        const cc = d1, val = d2;
        if (last < 0) last = val;
        const jump = Math.abs(val - last);
        last = val;
        if (jump > 20 || cc === 7 || cc === 11 || cc === 16 || cc === 17) {
          setEnergy(val / 127, "midi");
        } else if (val === 1 || val === 65 || val === 127) {
          nudgeEnergy(val > 64 ? -1 : 1, "midi");
        } else {
          setEnergy(val / 127, "midi");
        }
      };
      access.inputs.forEach(inp => { inp.onmidimessage = onMsg; });
      access.onstatechange = () => access.inputs.forEach(inp => { inp.onmidimessage = onMsg; });
      if (btn) { btn.textContent = "MIDI armed"; btn.classList.add("on"); }
    } catch (err) {
      if (btn) btn.textContent = "MIDI blocked";
      console.warn(err);
    }
  }

  // UI
  function fmt(v, step) {
    if (typeof v !== "number") return String(v);
    if (step >= 1) return String(Math.round(v));
    if (step >= 0.1) return v.toFixed(2);
    return v.toFixed(3);
  }

  const controls = [];
  function addGroup(title, builder) {
    const g = document.createElement("section");

    const h = document.createElement("h2");

    h.addEventListener("click", () => g.classList.toggle("shut"));

    aeBody.appendChild(g);
    builder(body);
  }
  function addRange(parent, key, label, min, max, step) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><span class="val"></span>`;
    const input = row.querySelector("input");
    const val = row.querySelector(".val");
    input.value = S[key];
    const show = (v) => key === "energy" ? (v * 10).toFixed(1) : fmt(v, step);
    val.textContent = show(+input.value);
    input.addEventListener("input", () => {
      if (key === "energy") setEnergy(+input.value, "panel");
      else S[key] = +input.value;
      val.textContent = show(+input.value);
    });
    controls.push({ key, input, val, step, kind: "range" });
    parent.appendChild(row);
  }
  function addSelect(parent, key, label, options) {
    const row = document.createElement("div");
    row.className = "row";
    row.style.gridTemplateColumns = "1fr 134px";
    const sel = document.createElement("select");
    for (const o of options) {
      const opt = document.createElement("option");
      opt.value = o.id; opt.textContent = o.label;
      sel.appendChild(opt);
    }
    sel.value = S[key];
    sel.addEventListener("change", () => {
      if (key === "preset") { applyPreset(sel.value, true); resetGhosts(); resetAll(true); }
      else if (key === "quality") { S.quality = sel.value; resetAll(true); }
      else S[key] = sel.value;
    });
    row.innerHTML = `<label>${label}</label>`;
    row.appendChild(sel);
    controls.push({ key, input: sel, kind: "select" });
    parent.appendChild(row);
  }

  addGroup("Playback", (b) => {
    const row = document.createElement("div");

    const mk = (id, label) => {
      const btn = document.createElement("button");
      btn.className = "act";
      btn.id = id;
      btn.textContent = label;
      row.appendChild(btn);
      return btn;
    };
    const pause = mk("btnPause", "Pause");
    mk("btnReset", "Reset");
    mk("btnClear", "Clear Density");
    mk("btnSeed", "Seed");
    pause.addEventListener("click", () => { S.paused = !S.paused; pause.classList.toggle("on", S.paused); pause.textContent = S.paused ? "Play" : "Pause"; });
    b.appendChild(row);
  });
  addGroup("Container", (b) => {
    addSelect(b, "preset", "Preset", Object.keys(PRESETS).map(id => ({ id, label: PRESETS[id].label })));
    addSelect(b, "quality", "Resolution", [
      { id: "low", label: "Low 128" },
      { id: "medium", label: "Medium 192" },
      { id: "high", label: "High 256" },
      { id: "ultra", label: "Ultra 384" }
    ]);
    addRange(b, "timestep", "Time Scale", 0.2, 2.0, 0.05);
    addRange(b, "dropoff", "Boundary Dropoff", 0, 0.4, 0.01);
  });
  addGroup("Dynamic Simulation", (b) => {
    addRange(b, "viscosity", "Viscosity", 0, 0.8, 0.01);
    addRange(b, "swirl", "Swirl", 0, 60, 0.5);
    addRange(b, "pressureIters", "Pressure Iterations", 4, 48, 1);
    addRange(b, "buoyancy", "Buoyancy", 0, 4, 0.05);
    addRange(b, "gravity", "Density Gravity", 0, 2, 0.01);
  });
  addGroup("Contents", (b) => {
    addRange(b, "velDiss", "Velocity Dissipation", 0, 0.8, 0.01);
    addRange(b, "densDiss", "Density Dissipation", 0, 0.8, 0.01);
    addRange(b, "tempDiss", "Temperature Dissipation", 0, 0.8, 0.01);
  });
  addGroup("Shading", (b) => {
    addRange(b, "shadow", "Self Shadow", 0, 3, 0.05);
    addRange(b, "ambient", "Ambient", 0, 1, 0.01);
    addRange(b, "incandescence", "Incandescence", 0, 2, 0.05);
    addRange(b, "bloom", "Glow", 0, 1.2, 0.01);
  });
  addGroup("Interaction", (b) => {
    addRange(b, "splatForce", "Splat Force", 500, 12000, 50);
    addRange(b, "splatRadius", "Splat Radius", 0.08, 0.7, 0.01);
    addRange(b, "densityAmt", "Density Amount", 0.05, 1.5, 0.05);
    addRange(b, "tempAmt", "Temperature", 0, 2, 0.05);
    addRange(b, "attract", "Attract", 0, 1, 1);
    addRange(b, "attractForce", "Attract Force", 0, 2, 0.05);
    const crow = document.createElement("div");
    crow.className = "row";
    crow.innerHTML = `<label>Color</label>`;
    const color = document.createElement("input");
    color.type = "color";
    color.value = S.color;
    color.addEventListener("input", () => { S.color = color.value; paintChips(); });
    crow.appendChild(color);
    const val = document.createElement("span");
    val.className = "val";
    crow.appendChild(val);
    controls.push({ key: "color", input: color, kind: "color" });
    b.appendChild(crow);
    const chips = document.createElement("div");
    chips.className = "chips";
    chips.id = "chips";
    CHIPS.forEach(hex => {
      const c = document.createElement("button");
      c.className = "chip";
      c.style.background = hex;
      c.type = "button";
      c.addEventListener("click", () => { S.color = hex; syncAll(); });
      chips.appendChild(c);
    });
    b.appendChild(chips);
  });
  addGroup("Display", (b) => {
    addSelect(b, "viz", "Visualization", VIZ);
  });

  function paintChips() {
    document.querySelectorAll(".chip").forEach(c => {
      c.classList.toggle("on", c.style.background === S.color || rgbOf(c.style.background) === S.color);
    });
  }
  function rgbOf() { return S.color; }

  function syncAll() {
    for (const c of controls) {
      if (c.kind === "range") {
        c.input.value = S[c.key];
        c.val.textContent = c.key === "energy" ? energyLabel() : fmt(+c.input.value, c.step);
      } else if (c.kind === "select" || c.kind === "color") {
        c.input.value = S[c.key];
      }
    }
    paintChips();
  }

  document.getElementById("btnHide").addEventListener("click", () => {
    document.getElementById("ae").style.display = "none";
  });
  aeBody.addEventListener("click", (e) => {
    const id = e.target.id;
    if (id === "btnReset") resetAll(true);
    if (id === "btnClear") clearDye();
    if (id === "btnSeed") seed(8);
  });

  const ENERGY_KEYS = new Set(["[", "]", "-", "=", "_", "+", ",", ".", "PageUp", "PageDown"]);
  window.addEventListener("keydown", (e) => {
    if (ENERGY_KEYS.has(e.key)) {
      e.preventDefault();
      const dir = (e.key === "]" || e.key === "=" || e.key === "+" || e.key === "." || e.key === "PageUp") ? 1 : -1;
      nudgeEnergy(dir * (e.shiftKey ? 0.35 : 1), "key");
      return;
    }
    if (e.key === " " ) { e.preventDefault(); S.paused = !S.paused; const b = document.getElementById("btnPause"); if (b) { b.classList.toggle("on", S.paused); b.textContent = S.paused ? "Play" : "Pause"; } }
    if (e.key === "h" || e.key === "H") {
      const ae = document.getElementById("ae");
      ae.style.display = ae.style.display === "none" ? "" : "none";
    }
    if (e.key === "r" || e.key === "R") resetAll(true);
    if (e.key === "c" || e.key === "C") clearDye();
    if (e.key >= "1" && e.key <= "7") S.viz = VIZ[+e.key - 1].id;
    if (e.key === "a" || e.key === "A") { S.attract = S.attract ? 0 : 1; syncAll(); }
  });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    nudgeEnergy((e.deltaY > 0 ? -1 : 1) * (e.shiftKey ? 0.35 : 1), "wheel");
  }, { passive: false });

  const wv = window.chrome && window.chrome.webview;
  if (wv && wv.addEventListener) {
    wv.addEventListener("message", (ev) => {
      let m = ev.data;
      if (typeof m === "string") { try { m = JSON.parse(m); } catch (_) { return; } }
      if (!m) return;
      if (typeof m.energy === "number") setEnergy(m.energy, "host");
      if (typeof m.delta === "number") nudgeEnergy(m.delta, "host");
    });
  }
  if (navigator.hid) {
    navigator.hid.getDevices().then(async (list) => {
      for (const d of list) if (d.vendorId === 0x046d) await listenHidDevice(d);
    }).catch(() => {});
    navigator.hid.addEventListener("connect", (ev) => {
      if (ev.device.vendorId === 0x046d) listenHidDevice(ev.device);
    });
  }
  window.ink = {
    setEnergy: (v) => setEnergy(v, "api"),
    getEnergy: () => S.energy,
    nudge: (d) => nudgeEnergy(d, "api")
  };

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => alloc(), 120);
  });

  setTimeout(() => document.body.classList.add("hint-off"), 4200);

  // persist app settings
  const STORE = "inkcontainer-v2";
  if (MODE === "app") {
    const hasQuery = [...qs.keys()].length > 0;
    if (!hasQuery) {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE) || "null");
        if (saved && saved.preset) {
          Object.assign(S, saved);
          syncAll();
        }
      } catch (_) {}
    }
    setInterval(() => {
      try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (_) {}
    }, 1500);
  }

  alloc();
  resetGhosts();
  resetAll(true);
  syncAll();
  updatePot();
  if (!KIOSK) document.getElementById("driveHud").classList.add("show");

  let last = performance.now();
  let fps = 60;
  let acc = 0;
  const renderer = gl.getParameter(gl.RENDERER) || "";

  function frame(now) {
    const raw = Math.min(0.05, (now - last) / 1000);
    last = now;
    fps = fps * 0.9 + (raw > 0 ? 1 / raw : 60) * 0.1;
    const dt = raw * S.timestep;

    if (!S.paused) {
      attract(dt, now * 0.001);
      stepSim(dt);
    }
    render();

    acc += raw;
    if (acc > 0.25 && !KIOSK) {
      acc = 0;
      const viz = (VIZ.find(v => v.id === S.viz) || VIZ[0]).label;
      hudEl.innerHTML =
        `<span class="node">fluidShape1</span>\n` +
        `2D Container  ${sim.vel.w}×${sim.vel.h}  dye ${sim.dye.w}×${sim.dye.h}\n` +
        `${Math.round(fps)} fps  ·  ${viz}${S.paused ? "  ·  PAUSED" : ""}\n` +
        `ENERGY ${energyLabel()}  ·  ${energySrc}\n` +
        `<span class="dim">${renderer}</span>`;
    }
    if (energyFlashT && now > energyFlashT) {
      energyFlashT = 0;
      if (KIOSK) document.getElementById("driveHud").classList.remove("show");
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
