<h1>Ink Container</h1>
<p>Native Rust + Vulkan (wgpu) fluid sim. There is no browser in the exe.</p>
<p>Desktop app, Windows screensaver (<code>.scr</code>), and OBS Game Capture via <code>InkContainer.exe --obs</code>.</p>
<p><a href="https://github.com/jethac/obs-fluids">github.com/jethac/obs-fluids</a></p>
<p>Download a Windows build from Actions artifacts, or <code>cargo build --release</code>.</p>
