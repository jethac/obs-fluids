[package]
name = "ink-container"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Vulkan GPU fluid sim — screensaver, desktop, OBS capture"
authors = ["Jetha Chan"]
repository = "https://github.com/jethac/obs-fluids"

[[bin]]
name = "ink-container"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = "24"
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
